name: Generate snake

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Santhoshkkumart
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=royalblue
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=lightskyblue

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refine profile snake animation"
          file_pattern: dist/*.svg
